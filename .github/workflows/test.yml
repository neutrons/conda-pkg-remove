name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  dryrun:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: test
        uses: ./
        with:
          ANACONDA_TOKEN: unset_token
          ORGANIZATION: neutronimaging
          PACKAGE_NAME: ibeatles
          LABEL: dev
          DRY_RUN: true
      - name: Install anaconda-client
        shell: bash
        run: pip install anaconda-client
