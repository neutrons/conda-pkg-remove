name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  dryrun:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: test
        uses: ./
        with:
          anaconda-token: unset_token
          organization: neutronimaging
          package-name: ibeatles
          label: dev
          dry-run: true
      - name: Install anaconda-client
        shell: bash
        run: pip install anaconda-client
