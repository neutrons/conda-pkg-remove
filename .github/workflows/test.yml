name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  keep-none:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test
        uses: ./
        with:
          anaconda_token: unset_token
          organization: neutronimaging
          package_name: ibeatles
          label: dev
          keep: 0
          dry_run: true
      - name: Check number files
        shell: bash
        run: |
           echo "Number of files is ${{ steps.Test.outputs.num_files }}"

  keep-all:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test
        uses: ./
        with:
          anaconda_token: unset_token
          organization: neutronimaging
          package_name: ibeatles
          label: dev
          keep: 100
          dry_run: true
      - name: Check number files
        shell: bash
        run: |
           echo "Number of files is ${{ steps.Test.outputs.num_files }}"
